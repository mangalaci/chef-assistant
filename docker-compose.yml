# docker compose up -d --build   -> database + web app on http://localhost:3000
# docker compose up -d postgres   -> database only (for `pnpm dev` on the host)
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_starter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_starter"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/rag_starter
      # Read from the .env file next to this one (or the shell environment).
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Add OPENAI_API_KEY to .env}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-5-mini}
      REASONING_EFFORT: ${REASONING_EFFORT:-low}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
